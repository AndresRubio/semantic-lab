name: checks

# A branch without a pull request is checked by hand: gh workflow run checks --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit with its version in a trailing comment, because a tag can
# move. Dependabot (.github/dependabot.yml) proposes new ones weekly, and
# tests/guards/test_workflows.py checks the pinning. The `static` and `offline` jobs run the
# same commands as scripts/check.sh. The tests marked `model` need Ollama and never run here.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
      - run: uv sync --extra dev --locked
      - run: uv run ruff check
      - run: uv run mypy

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
      - run: uv sync --extra dev --locked
      - run: uv run pytest -n auto -m "not db and not model"

  # The tests start docker compose themselves from tests/stack.env, so this job needs no
  # service containers and no secrets. They run without -n because they share one stack.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
      - run: uv sync --extra dev --locked
      - run: uv run pytest -m db
