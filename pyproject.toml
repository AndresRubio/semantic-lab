[project]
name = "semantic-lab"
version = "0.1.0"
description = "A lab for comparing semantic layers over the same data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "psycopg[binary]",
    "neo4j",
    "rdflib>=7.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff==0.14.0",
    "mypy==1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_lab"]

[tool.pytest.ini_options]
addopts = "-m 'not model'"
markers = [
    "db: needs Docker",
    "model: calls Ollama",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "RUF100"]

[tool.mypy]
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
